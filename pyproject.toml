[project]
name = "document-library"
version = "0.1.0"
description = "Document Library core foundations"
requires-python = ">=3.14,<3.15"
dependencies = [
    "SQLAlchemy==2.1.6",
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "defusedxml==0.7.1",
    "fastapi==0.159.1",
    "pillow==13.0.0",
    "pypdf==6.21.4",
    "telethon==1.45.0",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false
constraint-dependencies = ["pyasn1==0.6.5"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
]
